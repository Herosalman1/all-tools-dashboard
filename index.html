<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Herosalman1 Tools Dashboard</title>
    <style>
        /* Modern Font & Reset */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #0d1117; /* Deep dark background */
            color: #c9d1d9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 40px 20px;
        }

        /* Sleek Container */
        .container {
            width: 100%;
            max-width: 950px;
            background-color: #161b22;
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            border: 1px solid #30363d;
        }

        /* Neon Title */
        h1 {
            text-align: center;
            color: #00ff88;
            margin-bottom: 40px;
            font-size: 26px;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-shadow: 0 0 10px rgba(0, 255, 136, 0.2);
        }

        /* Table Styling */
        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th, td {
            padding: 18px 20px;
        }

        th {
            color: #8b949e;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            border-bottom: 1px solid #30363d;
        }

        td {
            font-size: 15px;
            font-weight: 500;
            border-bottom: 1px solid #21262d;
        }

        tr:last-child td {
            border-bottom: none; /* Removes border from the last row */
        }

        tr {
            transition: background-color 0.2s ease;
        }

        tr:hover {
            background-color: #1f242c; /* Subtle hover effect */
        }

        /* Action Button */
        .visit-btn {
            background-color: #00ea77;
            color: #000000;
            border: none;
            padding: 8px 24px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(0, 234, 119, 0.2);
        }

        .visit-btn:hover {
            background-color: #00ff88;
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(0, 234, 119, 0.4);
        }

        .visit-btn:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>#Herosalman1 All Tool's 😎🔥</h1>
        
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th width="15%">S.NO</th>
                        <th width="65%">TOOLS NAME</th>
                        <th width="20%">ACTION</th>
                    </tr>
                </thead>
                <tbody id="toolsListBody">
                    <!-- JS automatically lists tools here -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const tableBody = document.getElementById('toolsListBody');

        // Yahan se tools.json ko fetch karega
        fetch('tools.json')
            .then(response => response.json())
            .then(myTools => {
                
                // Agar list khali hai (0 entry), toh ye message dikhayega
                if (myTools.length === 0) {
                    tableBody.innerHTML = `
                        <tr>
                            <td colspan="3" style="text-align:center; color:#8b949e; padding: 30px;">
                                Abhi koi tool add nahi hua hai. Admin panel se add karein!
                            </td>
                        </tr>`;
                    return;
                }

                // Agar tools hain, toh list banayega
                myTools.forEach((tool, index) => {
                    const row = document.createElement('tr');
                    
                    row.innerHTML = `
                        <td>${index + 1}</td>
                        <td style="color: #ffffff;">${tool.name}</td>
                        <td>
                            <button class="visit-btn" onclick="visitSite('${tool.url}')">VISIT 🚀</button>
                        </td>
                    `;
                    
                    tableBody.appendChild(row);
                });
            })
            .catch(error => {
                console.error('Error:', error);
                tableBody.innerHTML = '<tr><td colspan="3" style="text-align:center; color:#da3633;">Data load nahi ho paya!</td></tr>';
            });

        // Background me link open karne ka function
        function visitSite(url) {
            if (url && url !== "YOUR_LINK_HERE" && url !== "#") {
                window.open(url, '_blank');
            } else {
                alert("Salman bhai, is tool ka link abhi add nahi hua hai!");
            }
        }
    </script>

</body>
</html>
