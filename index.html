<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Herosalman1 | Projects</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #000000;
            --card-bg: #0a0a0a;
            --border: #222222;
            --text: #ededed;
            --muted: #a1a1aa;
            --hover: #111111;
        }
        
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: 'Inter', -apple-system, sans-serif; 
        }
        
        body { 
            background-color: var(--bg); 
            color: var(--text); 
            padding: 80px 20px; 
            display: flex; 
            justify-content: center; 
            min-height: 100vh;
        }
        
        .container { 
            width: 100%; 
            max-width: 850px; 
        }
        
        .header { 
            margin-bottom: 32px; 
        }
        
        .header h1 { 
            font-size: 24px; 
            font-weight: 600; 
            letter-spacing: -0.5px; 
            color: var(--text);
        }
        
        .header p { 
            color: var(--muted); 
            font-size: 14px; 
            margin-top: 6px; 
        }
        
        .card { 
            background-color: var(--card-bg); 
            border: 1px solid var(--border); 
            border-radius: 8px; 
            overflow: hidden; 
        }
        
        table { 
            width: 100%; 
            border-collapse: collapse; 
        }
        
        th, td { 
            padding: 16px 24px; 
            text-align: left; 
            border-bottom: 1px solid var(--border); 
            font-size: 14px; 
        }
        
        th { 
            color: var(--muted); 
            font-weight: 500; 
            font-size: 12px; 
            text-transform: uppercase;
            letter-spacing: 0.5px;
            background-color: #050505;
        }
        
        tr:last-child td { 
            border-bottom: none; 
        }
        
        tr {
            transition: background-color 0.2s;
        }
        
        tr:hover { 
            background-color: var(--hover); 
        }
        
        .s-no {
            color: var(--muted);
        }

        .tool-name { 
            font-weight: 500; 
            color: var(--text); 
        }
        
        .btn { 
            background: transparent; 
            color: var(--text); 
            border: 1px solid var(--border); 
            padding: 8px 16px; 
            border-radius: 6px; 
            font-size: 12px; 
            font-weight: 500; 
            cursor: pointer; 
            transition: all 0.2s; 
            display: inline-flex; 
            align-items: center; 
            gap: 8px;
        }
        
        .btn:hover { 
            background: var(--text); 
            color: var(--bg); 
            border-color: var(--text);
        }

        .btn svg { 
            width: 14px; 
            height: 14px; 
            fill: currentColor;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>Herosalman1 Repository</h1>
            <p>A collection of my custom front-end tools, scripts, and generators.</p>
        </div>
        
        <div class="card">
            <table>
                <thead>
                    <tr>
                        <th width="10%">#</th>
                        <th width="70%">Project Name</th>
                        <th width="20%">Link</th>
                    </tr>
                </thead>
                <tbody id="toolsListBody">
                    <!-- JS automatically lists tools here from tools.json -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const tableBody = document.getElementById('toolsListBody');

        // GitHub se direct live data fetch karega
        fetch('tools.json')
            .then(response => response.json())
            .then(myTools => {
                myTools.forEach((tool, index) => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td class="s-no">${(index + 1).toString().padStart(2, '0')}</td>
                        <td class="tool-name">${tool.name}</td>
                        <td>
                            <button class="btn" onclick="visitSite('${tool.url}')">
                                Visit
                                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                    <path d="M10 6V8H5V19H16V14H18V20C18 20.5523 17.5523 21 17 21H4C3.44772 21 3 20.5523 3 20V7C3 6.44772 3.44772 6 4 6H10ZM21 3V11H19L18.9999 6.413L11.2071 14.2071L9.79289 12.7929L17.5849 5H13V3H21Z"/>
                                </svg>
                            </button>
                        </td>
                    `;
                    tableBody.appendChild(row);
                });
            })
            .catch(error => {
                console.error('Error loading tools:', error);
                tableBody.innerHTML = '<tr><td colspan="3" style="text-align:center; color:red;">Error loading data. Make sure tools.json exists.</td></tr>';
            });

        function visitSite(url) {
            if (url && url !== "#") window.open(url, '_blank');
            else alert("Link abhi add nahi kiya hai.");
        }
    </script>

</body>
</html>
