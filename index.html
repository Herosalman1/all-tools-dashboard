<script>
    const tableBody = document.getElementById('toolsListBody');

    // GitHub se direct live data fetch karega
    fetch('tools.json')
        .then(response => response.json())
        .then(myTools => {
            myTools.forEach((tool, index) => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td class="s-no">${(index + 1).toString().padStart(2, '0')}</td>
                    <td class="tool-name">${tool.name}</td>
                    <td>
                        <button class="btn" onclick="visitSite('${tool.url}')">
                            Visit
                            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                <path d="M10 6V8H5V19H16V14H18V20C18 20.5523 17.5523 21 17 21H4C3.44772 21 3 20.5523 3 20V7C3 6.44772 3.44772 6 4 6H10ZM21 3V11H19L18.9999 6.413L11.2071 14.2071L9.79289 12.7929L17.5849 5H13V3H21Z"/>
                            </svg>
                        </button>
                    </td>
                `;
                tableBody.appendChild(row);
            });
        })
        .catch(error => console.error('Error loading tools:', error));

    function visitSite(url) {
        if (url && url !== "#") window.open(url, '_blank');
        else alert("Link update nahi hua hai.");
    }
</script>
