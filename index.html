<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Herosalman1 Tools Dashboard</title>
    <style>
        /* Modern Font & Reset */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }

        body {
            background-color: #0d1117; 
            color: #c9d1d9;
            padding: 15px 10px;
        }

        .container {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            background-color: #161b22;
            border-radius: 12px;
            padding: 20px 10px; 
            border: 1px solid #30363d;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        /* 👑 HEADING EKDUM EK LINE MEIN AAYEGI 👑 */
        h1 {
            text-align: center;
            color: #00ff88;
            margin-bottom: 25px;
            font-size: 19px; /* Size adjust kiya taaki ek line me aaye */
            font-weight: 800;
            white-space: nowrap; /* Ye line heading ko next line me jaane se rokegi */
            text-shadow: 0 0 15px rgba(0, 255, 136, 0.3);
        }

        /* 📱 LIST BOXES (Perfect Size) 📱 */
        .list-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: #010409;
            margin-bottom: 12px; 
            padding: 12px 14px; /* Box thoda medium kiya */
            border-radius: 12px;
            border: 1px solid #30363d;
        }

        .item-info {
            display: flex;
            align-items: center;
            gap: 12px; 
            flex: 1;
        }

        .sno {
            color: #8b949e;
            font-size: 14px; /* Serial no. ka size kam kiya */
            font-weight: 600;
            min-width: 22px;
        }

        /* 📝 TOOLS KA NAAM BINA KATE POORA DIKHEGA 📝 */
        .tool-name {
            color: #ffffff;
            font-size: 15px; /* Size thoda kam kiya */
            font-weight: 700;
            line-height: 1.3;
            word-break: break-word; /* Agar naam bada hua to '...' ki jagah poora dikhayega */
        }

        /* 🚀 VISIT BUTTON (Medium aur Sundar) 🚀 */
        .visit-btn {
            background-color: #00ea77;
            color: #000;
            border: none;
            padding: 10px 16px; /* Button ko thoda chota aur smart kiya */
            border-radius: 8px;
            font-weight: 800;
            font-size: 13px; /* Button ka text chota kiya */
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 234, 119, 0.2);
            white-space: nowrap;
            margin-left: 8px;
        }

        .visit-btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>#Herosalman1 All Tool's 😎🔥</h1>
        <div id="toolsListBody">
            <!-- JS automatically yahan naye style me tools list karega -->
        </div>
    </div>

    <script>
        const container = document.getElementById('toolsListBody');

        // Yahan se tools.json ko fetch karega
        fetch('tools.json')
            .then(response => response.json())
            .then(myTools => {
                
                if (myTools.length === 0) {
                    container.innerHTML = '<p style="text-align:center; color:#8b949e; padding: 20px; font-size: 15px;">Abhi koi tool add nahi hua hai. Admin panel se add karein!</p>';
                    return;
                }

                myTools.forEach((tool, index) => {
                    container.innerHTML += `
                        <div class="list-item">
                            <div class="item-info">
                                <span class="sno">${index + 1}</span>
                                <span class="tool-name">${tool.name}</span>
                            </div>
                            <button class="visit-btn" onclick="visitSite('${tool.url}')">Visit 🔍</button>
                        </div>
                    `;
                });
            })
            .catch(error => {
                console.error('Error:', error);
                container.innerHTML = '<p style="text-align:center; color:#da3633; font-size: 15px;">Data load nahi ho paya!</p>';
            });

        function visitSite(url) {
            if (url && url !== "YOUR_LINK_HERE" && url !== "#") {
                window.open(url, '_blank');
            } else {
                alert("Salman bhai, is tool ka link abhi add nahi hua hai!");
            }
        }
    </script>

</body>
</html>
