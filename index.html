<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Herosalman1 Tools Dashboard</title>
    <style>
        /* Modern Font & Reset */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #0d1117; 
            color: #c9d1d9;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 40px 20px;
        }

        /* Sleek Container */
        .container {
            width: 100%;
            max-width: 950px;
            background-color: #161b22;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            border: 1px solid #30363d;
        }

        /* Neon Title */
        h1 {
            text-align: center;
            color: #00ff88;
            margin-bottom: 35px;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-shadow: 0 0 10px rgba(0, 255, 136, 0.2);
        }

        /* Table Styling */
        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        /* Classes for columns to control width and spacing perfectly */
        .col-sno { width: 10%; text-align: center; }
        .col-name { width: auto; text-align: left; padding-left: 10px; }
        .col-action { width: 1%; white-space: nowrap; text-align: right; } /* 1% trick to shrink action column */

        th, td {
            padding: 20px 10px;
        }

        th {
            color: #8b949e;
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid #30363d;
        }

        td {
            font-size: 16px;
            font-weight: 500;
            border-bottom: 1px solid #21262d;
            word-break: break-word;
        }

        tr:last-child td {
            border-bottom: none; 
        }

        tr:hover {
            background-color: #1f242c; 
        }

        /* Action Button */
        .visit-btn {
            background-color: #00ea77;
            color: #000000;
            border: none;
            padding: 10px 24px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(0, 234, 119, 0.2);
            white-space: nowrap;
        }

        .visit-btn:hover {
            background-color: #00ff88;
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(0, 234, 119, 0.4);
        }

        /* ===== MOBILE RESPONSIVE CSS (Bigger, Tighter, Better) ===== */
        @media screen and (max-width: 600px) {
            body {
                padding: 10px 5px; /* Side margin ekdum kam kar diya taaki screen width mile */
            }
            .container {
                padding: 20px 8px; 
                border-radius: 12px;
            }
            h1 {
                font-size: 24px; 
                margin-bottom: 20px;
            }
            th, td {
                padding: 18px 5px; /* Horizontal gap kam kiya, Vertical size badhaya */
            }
            th {
                font-size: 11px;
            }
            
            /* Text & Column Adjustments for Mobile */
            .col-sno { width: 12%; font-size: 14px; }
            .col-name { font-size: 17px; font-weight: 600; } /* Text ekdum bold aur bada kiya */
            
            /* Button Bada Kiya */
            .visit-btn {
                padding: 12px 18px; 
                font-size: 14px; 
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>#Herosalman1 All Tool's 😎🔥</h1>
        
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th class="col-sno">S.NO</th>
                        <th class="col-name">TOOLS NAME</th>
                        <th class="col-action">ACTION</th>
                    </tr>
                </thead>
                <tbody id="toolsListBody">
                    <!-- JS automatically lists tools here -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const tableBody = document.getElementById('toolsListBody');

        // Yahan se tools.json ko fetch karega
        fetch('tools.json')
            .then(response => response.json())
            .then(myTools => {
                
                if (myTools.length === 0) {
                    tableBody.innerHTML = `
                        <tr>
                            <td colspan="3" style="text-align:center; color:#8b949e; padding: 30px; font-size: 16px;">
                                Abhi koi tool add nahi hua hai. Admin panel se add karein!
                            </td>
                        </tr>`;
                    return;
                }

                myTools.forEach((tool, index) => {
                    const row = document.createElement('tr');
                    
                    row.innerHTML = `
                        <td class="col-sno">${index + 1}</td>
                        <td class="col-name" style="color: #ffffff;">${tool.name}</td>
                        <td class="col-action">
                            <button class="visit-btn" onclick="visitSite('${tool.url}')">VISIT 🚀</button>
                        </td>
                    `;
                    
                    tableBody.appendChild(row);
                });
            })
            .catch(error => {
                console.error('Error:', error);
                tableBody.innerHTML = '<tr><td colspan="3" style="text-align:center; color:#da3633; font-size: 16px;">Data load nahi ho paya!</td></tr>';
            });

        // Background me link open karne ka function
        function visitSite(url) {
            if (url && url !== "YOUR_LINK_HERE" && url !== "#") {
                window.open(url, '_blank');
            } else {
                alert("Salman bhai, is tool ka link abhi add nahi hua hai!");
            }
        }
    </script>

</body>
</html>
