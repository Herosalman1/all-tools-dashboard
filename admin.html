<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>GitHub Live Admin Panel</title>
    <style>
        * { box-sizing: border-box; font-family: sans-serif; }
        body { background: #0d1117; color: #c9d1d9; padding: 20px; max-width: 600px; margin: auto; }
        .box { background: #161b22; padding: 20px; border-radius: 10px; margin-bottom: 20px; border: 1px solid #30363d; }
        input { width: 100%; padding: 10px; margin: 10px 0; background: #0d1117; color: white; border: 1px solid #30363d; border-radius: 5px; }
        button { padding: 10px 15px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .btn-green { background: #238636; color: white; width: 100%; }
        .btn-red { background: #da3633; color: white; padding: 5px 10px; }
        .list-item { display: flex; justify-content: space-between; margin-bottom: 10px; padding: 10px; background: #000; border-radius: 5px; }
    </style>
</head>
<body>

    <h2>Live GitHub Admin Panel</h2>

    <div class="box">
        <label>GitHub Personal Access Token:</label>
        <input type="password" id="gitToken" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx">
        <label>Repository (e.g., Herosalman1/my-repo-name):</label>
        <input type="text" id="gitRepo" placeholder="Herosalman1/repo-name">
        <button class="btn-green" onclick="loadData()">1. LOAD PROJECTS FROM GITHUB</button>
    </div>

    <div class="box" id="editorSection" style="display:none;">
        <h3 style="color:#00ff88">ADD NEW ENTRY ✅</h3>
        <input type="text" id="pName" placeholder="Project Name">
        <input type="text" id="pLink" placeholder="Project Link">
        <button class="btn-green" style="background:#00ea77; color:black;" onclick="addTool()">+ ADD TO LIST</button>
        
        <h3 style="margin-top:20px;">CURRENT PROJECTS</h3>
        <div id="projectList"></div>

        <button class="btn-green" style="margin-top:20px; background:#1f6feb;" onclick="saveToGitHub()">2. SAVE & PUSH TO GITHUB 🚀</button>
    </div>

    <script>
        let toolsArray = [];
        let fileSha = ""; // GitHub file tracking id

        async function loadData() {
            const token = document.getElementById('gitToken').value;
            const repo = document.getElementById('gitRepo').value;
            
            if(!token || !repo) return alert("Token aur Repo Name daalo bhai!");

            try {
                const response = await fetch(`https://api.github.com/repos/${repo}/contents/tools.json`, {
                    headers: { 'Authorization': `token ${token}` }
                });
                const data = await response.json();
                
                if(data.content) {
                    fileSha = data.sha;
                    // Decode Base64 from GitHub
                    const decodedData = decodeURIComponent(escape(atob(data.content)));
                    toolsArray = JSON.parse(decodedData);
                    document.getElementById('editorSection').style.display = 'block';
                    renderList();
                    alert("Data Loaded from GitHub!");
                }
            } catch (error) {
                alert("Error! Check repo name or token.");
            }
        }

        function renderList() {
            const list = document.getElementById('projectList');
            list.innerHTML = "";
            toolsArray.forEach((tool, index) => {
                list.innerHTML += `
                    <div class="list-item">
                        <span>${index + 1}. ${tool.name}</span>
                        <button class="btn-red" onclick="deleteTool(${index})">DELETE</button>
                    </div>`;
            });
        }

        function addTool() {
            const name = document.getElementById('pName').value;
            const link = document.getElementById('pLink').value;
            if(name && link) {
                toolsArray.push({name, url: link});
                document.getElementById('pName').value = "";
                document.getElementById('pLink').value = "";
                renderList();
            }
        }

        function deleteTool(index) {
            toolsArray.splice(index, 1);
            renderList();
        }

        async function saveToGitHub() {
            const token = document.getElementById('gitToken').value;
            const repo = document.getElementById('gitRepo').value;
            
            const updatedJson = JSON.stringify(toolsArray, null, 2);
            const encodedContent = btoa(unescape(encodeURIComponent(updatedJson)));

            try {
                const response = await fetch(`https://api.github.com/repos/${repo}/contents/tools.json`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: "Updated tools list via Admin Panel",
                        content: encodedContent,
                        sha: fileSha
                    })
                });

                if(response.ok) {
                    const data = await response.json();
                    fileSha = data.content.sha; // Update SHA for future edits
                    alert("✅ Boom! Data directly saved to GitHub Repository!");
                } else {
                    alert("Error saving data.");
                }
            } catch (error) {
                alert("Failed to push to GitHub.");
            }
        }
    </script>
</body>
</html>
